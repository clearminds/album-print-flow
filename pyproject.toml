[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "album-print-flow"
version = "1.0.0"
description = "Linux-first photo crop/stamp/print tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11.0.0",
  "PySide6>=6.7.3",
  "pyipp>=0.17.2",
  "google-auth>=2.40.0",
  "google-auth-oauthlib>=1.2.2",
  "keyring>=25.6.0",
  "pillow-heif>=0.18.0",
  "rawpy>=0.25.1",
  "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=4.1.0",
  "black>=25.1.0",
  "isort>=5.13.2",
  "flake8>=7.1.1",
  "ruff>=0.9.10",
]

[project.scripts]
album-print-flow = "album_print_flow.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B"]
ignore = ["E203"]

# ── Briefcase packaging ──────────────────────────────────────────────

[tool.briefcase]
project_name = "Album Print Flow"
bundle = "se.clearminds"
version = "1.0.0"
url = "https://github.com/clearminds/album-print-flow"
license.file = "LICENSE"
author = "Clearminds"
author_email = "info@clearminds.se"

[tool.briefcase.app.album-print-flow]
formal_name = "Album Print Flow"
description = "Crop, stamp and print photo albums"
icon = "assets/icons/png/app-icon"
sources = ["src/album_print_flow"]
requires = [
    "Pillow>=11.0.0",
    "PySide6>=6.7.3",
    "pyipp>=0.17.2",
    "google-auth>=2.40.0",
    "google-auth-oauthlib>=1.2.2",
    "keyring>=25.6.0",
    "pillow-heif>=0.18.0",
    "rawpy>=0.25.1",
    "requests>=2.32.5",
]

[tool.briefcase.app.album-print-flow.macOS]
universal_build = false
requires = []

[tool.briefcase.app.album-print-flow.linux]
requires = []

[tool.briefcase.app.album-print-flow.linux.flatpak]
flatpak_runtime = "org.kde.Platform"
flatpak_runtime_version = "6.7"
flatpak_sdk = "org.kde.Sdk"

[tool.briefcase.app.album-print-flow.windows]
requires = []
