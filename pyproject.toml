[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "album-print-flow"
version = "0.1.0"
description = "Linux-first photo crop/stamp/print tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11.0.0",
  "PySide6>=6.8.0",
  "pyipp>=0.17.2",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=4.1.0",
  "black>=25.1.0",
  "isort>=5.13.2",
  "flake8>=7.1.1",
  "ruff>=0.9.10",
]

[project.scripts]
album-print-flow = "album_printer.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E203"]
