name: Dev Build

on:
  push:
    branches:
      - "development"
      - "feature/*"
    tags:
      - "v*-dev*"
  pull_request:
  workflow_dispatch:

jobs:
  test-and-smoke-build:
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]

      - name: Run pre-commit
        run: |
          pre-commit run --all-files --show-diff-on-failure

      - name: Import smoke test
        run: |
          python -c "from album_printer.main import main; print('import-ok')"
        env:
          PYTHONPATH: src

      - name: Build app bundle (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean --name album-printer --windowed --paths src --collect-data album_printer src/album_printer/main.py

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-build-${{ github.run_number }}-${{ matrix.os }}
          path: dist/**
          retention-days: 7
