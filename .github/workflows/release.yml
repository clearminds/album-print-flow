name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build release bundle
        run: |
          pyinstaller --noconfirm --clean --name album-printer --windowed --paths src --collect-data album_printer src/album_printer/main.py

      - name: Package artifact (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          if [ -d dist/album-printer.app ]; then
            tar -czf release/album-printer-${{ matrix.os }}.tar.gz -C dist album-printer.app
          elif [ -d dist/album-printer ]; then
            tar -czf release/album-printer-${{ matrix.os }}.tar.gz -C dist album-printer
          else
            echo "Expected dist/album-printer.app or dist/album-printer, but neither exists"
            ls -la dist
            exit 1
          fi

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          if (Test-Path "dist/album-printer") {
            Compress-Archive -Path "dist/album-printer" -DestinationPath "release/album-printer-${{ matrix.os }}.zip" -Force
          } elseif (Test-Path "dist/album-printer.exe") {
            Compress-Archive -Path "dist/album-printer.exe" -DestinationPath "release/album-printer-${{ matrix.os }}.zip" -Force
          } else {
            Write-Error "Expected dist/album-printer or dist/album-printer.exe, but neither exists"
            Get-ChildItem dist
            exit 1
          }

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: release/*

  publish:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
